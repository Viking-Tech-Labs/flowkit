# flowkit tmux kit, for running a chain of Claude Code sessions in tmux.
# Your own tmux.conf loads it with one line:  source-file ~/.config/flowkit/tmux.conf
# The handoff plugin rewrites this file to its own version at every Claude Code session start,
# so put your changes in your own tmux.conf, below that line: a setting there wins.
# Cheat sheet: prefix H, or ~/.config/flowkit/tmux-cheatsheet.md. Needs tmux 3.2 or later.

# The prefix stays tmux's default, Ctrl-b; this file does not set one.
set -g mouse on                 # click a pane to focus it, drag a border to resize, scroll to read back
set -g base-index 1             # tabs and panes count from 1, like the keys on the keyboard
setw -g pane-base-index 1

# How many sessions wait on you (a question, a permission): ⚑ in the status bar, and ⚑<n> on
# each tab that has some. Refreshed every 15 seconds from `claude agents`.
set -g status-interval 15
set -g status-right-length 80
set -g status-right '#($HOME/.local/bin/flowkit-tmux waiting)"#{=21:pane_title}" %H:%M %d-%b-%y'
set -g window-status-format '#I:#W#{?#{@flowkit_wait},⚑#{@flowkit_wait},}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#W#{?#{@flowkit_wait},⚑#{@flowkit_wait},}#{?window_flags,#{window_flags}, }'

# prefix a: every Claude session, waiting ones first; type its number to jump there.
# prefix H: the cheat sheet. (run-shell, because display-popup does not expand #{} itself.)
bind a run-shell 'tmux display-popup -c "#{client_name}" -E -w 90% -h 80% -T " Claude sessions " "$HOME/.local/bin/flowkit-tmux list #{client_name}"'
bind H display-popup -E -w 80% -h 90% -T " flowkit tmux " "$HOME/.local/bin/flowkit-tmux help"
